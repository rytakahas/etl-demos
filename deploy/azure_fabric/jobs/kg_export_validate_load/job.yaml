# Azure Container Apps Job template (placeholder/spec)
name: bank-kg-export-validate-load
triggerType: Manual
replicaTimeout: 3600
replicaRetryLimit: 1
container:
  image: <ACR_NAME>.azurecr.io/bank-kg-export:rc-1.1.0
  env:
    - name: GOLD_DIR
      value: /mnt/gold
    - name: OUT_DIR
      value: /mnt/out
    - name: NEO4J_URI
      secretRef: neo4j-uri
    - name: NEO4J_USER
      secretRef: neo4j-user
    - name: NEO4J_PASSWORD
      secretRef: neo4j-password
    - name: NEO4J_DB
      value: neo4j
