services:
  langgraph-api:
    build:
      context: .
      dockerfile: docker/langgraph/Dockerfile.langgraph
    container_name: bankkg-langgraph
    ports:
      - "8090:8090"
    environment:
      # Neo4j connection used by src/bankkg/langgraph/tools_neo4j.py
      NEO4J_URI: "bolt://host.docker.internal:7687"
      NEO4J_USER: "neo4j"
      NEO4J_PASSWORD: "Password123!"
      NEO4J_DB: "neo4j"
    extra_hosts:
      # Makes host.docker.internal resolve reliably on Linux; harmless on Mac
      - "host.docker.internal:host-gateway"
    restart: unless-stopped

