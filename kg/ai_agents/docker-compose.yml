services:
  neo4j:
    image: neo4j:5
    container_name: kg-neo4j
    ports:
      - "127.0.0.1:7475:7474"   # avoid clashing with your existing hb-neo4j on 7474
      - "127.0.0.1:7688:7687"   # avoid clashing with your existing hb-neo4j on 7687
    environment:
      - NEO4J_AUTH=neo4j/Password123!
    volumes:
      - kg_neo4j_data:/data
      - kg_neo4j_logs:/logs

  # n8n (self-hosted, free)
  n8n:
    image: n8nio/n8n:latest
    container_name: kg-n8n
    ports:
      - "127.0.0.1:5678:5678"
    environment:
      - N8N_HOST=localhost
      - N8N_PORT=5678
      - N8N_PROTOCOL=http
      - WEBHOOK_URL=http://localhost:5678/
      - GENERIC_TIMEZONE=Europe/Madrid
    volumes:
      - kg_n8n_data:/home/node/.n8n
    depends_on:
      - neo4j

  # Local LLM runtime (free). You pull small models to keep it light.
  ollama:
    image: ollama/ollama:latest
    container_name: kg-ollama
    ports:
      - "127.0.0.1:11434:11434"
    volumes:
      - kg_ollama:/root/.ollama

  # Minimal “KG loader” API (your agent/automation calls this; it upserts into Neo4j)
  kg_loader:
    image: python:3.11-slim
    container_name: kg-loader
    working_dir: /app
    volumes:
      - ./loader:/app
    environment:
      - NEO4J_URI=bolt://neo4j:7687
      - NEO4J_USERNAME=neo4j
      - NEO4J_PASSWORD=Password123!
    command: bash -lc "pip install -r requirements.txt && python app.py"
    ports:
      - "127.0.0.1:8009:8009"
    depends_on:
      - neo4j

volumes:
  kg_neo4j_data:
  kg_neo4j_logs:
  kg_n8n_data:
  kg_ollama:

