services:
  airflow:
    build:
      context: .
      dockerfile: docker/Dockerfile.airflow
    environment:
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: password
      NEO4J_DATABASE: neo4j
    ports:
      - "8080:8080"
    volumes:
      - ./:/usr/local/airflow
    depends_on:
      - neo4j
    command: >
      bash -lc "
      airflow db migrate &&
      airflow users create --username admin --password admin --firstname admin --lastname admin --role Admin --email admin@example.com || true &&
      airflow scheduler & airflow webserver
      "

  neo4j:
    image: neo4j:5
    ports:
      - "7474:7474"
      - "7687:7687"
    environment:
      NEO4J_AUTH: "neo4j/password"
      NEO4JLABS_PLUGINS: '["n10s"]'
      NEO4J_dbms_security_procedures_unrestricted: "n10s.*"
      NEO4J_dbms_security_procedures_allowlist: "n10s.*"
      NEO4J_dbms_directories_import: "/var/lib/neo4j/import"
    volumes:
      - ./kg/neo4j/import:/var/lib/neo4j/import
      - ./kg/neo4j/data:/data
      - ./kg/neo4j/logs:/logs
