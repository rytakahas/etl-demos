name: dbt CD

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  dbt-cd:
    runs-on: ubuntu-latest

    env:
      DBT_PROJECT_DIR: dbt
      DBT_PROFILES_DIR: dbt

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dbt-bigquery
        run: |
          python -m pip install --upgrade pip
          pip install "dbt-bigquery==1.10.3"

      - name: Write GCP service account key (base64) + export env var
        shell: bash
        run: |
          KEY_PATH="${GITHUB_WORKSPACE}/gcp-dbt-sa.json"
          echo "${{ secrets.GCP_SA_KEY_B64 }}" | base64 --decode > "${KEY_PATH}"
          echo "GOOGLE_APPLICATION_CREDENTIALS=${KEY_PATH}" >> "$GITHUB_ENV"

      - name: dbt deps
        run: |
          dbt deps --project-dir "${DBT_PROJECT_DIR}" --profiles-dir "${DBT_PROFILES_DIR}"

      - name: dbt build (cd)
        run: |
          dbt build --project-dir "${DBT_PROJECT_DIR}" --profiles-dir "${DBT_PROFILES_DIR}" --target cd

