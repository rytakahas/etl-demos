name: dbt CI

on:
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  dbt-ci:
    runs-on: ubuntu-latest

    env:
      DBT_PROJECT_DIR: dbt
      DBT_PROFILES_DIR: dbt

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dbt-bigquery
        run: |
          python -m pip install --upgrade pip
          pip install "dbt-bigquery==1.10.3"

      - name: Sanity check dbt project files
        run: |
          test -f "${DBT_PROJECT_DIR}/dbt_project.yml"
          test -f "${DBT_PROFILES_DIR}/profiles.yml"
          echo "OK: dbt_project.yml and profiles.yml found."

      - name: Decide CI mode (build vs skip)
        shell: bash
        run: |
          if [ -z "${{ secrets.GCP_SA_KEY_B64 }}" ]; then
            echo "SKIP_DBT=true" >> "$GITHUB_ENV"
            echo "No GCP secret available. Skipping dbt steps."
          else
            echo "SKIP_DBT=false" >> "$GITHUB_ENV"
          fi

      - name: Write GCP service account key (base64) + export env var
        if: env.SKIP_DBT == 'false'
        shell: bash
        run: |
          KEY_PATH="${GITHUB_WORKSPACE}/gcp-dbt-sa.json"
          echo "${{ secrets.GCP_SA_KEY_B64 }}" | base64 --decode > "${KEY_PATH}"
          echo "GOOGLE_APPLICATION_CREDENTIALS=${KEY_PATH}" >> "$GITHUB_ENV"

      - name: dbt deps
        if: env.SKIP_DBT == 'false'
        run: |
          dbt deps --project-dir "${DBT_PROJECT_DIR}" --profiles-dir "${DBT_PROFILES_DIR}"

      - name: dbt build (ci)
        if: env.SKIP_DBT == 'false'
        run: |
          dbt build --project-dir "${DBT_PROJECT_DIR}" --profiles-dir "${DBT_PROFILES_DIR}" --target ci

