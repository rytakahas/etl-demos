name: dbt CI

on:
  pull_request:
    branches: [ main ]

jobs:
  dbt-ci:
    runs-on: ubuntu-latest

    env:
      # For BigQuery example – adapt env vars to your setup
      DBT_PROFILES_DIR: ./.github/dbt_profiles
      GOOGLE_APPLICATION_CREDENTIALS: ${{ github.workspace }}/gcp-key.json

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dbt
        run: |
          python -m pip install --upgrade pip
          pip install dbt-bigquery

      - name: Write GCP service account key
        run: |
          echo '${{ secrets.GCP_SERVICE_ACCOUNT_KEY }}' > $GOOGLE_APPLICATION_CREDENTIALS

      - name: dbt deps
        run: dbt deps

      - name: dbt compile
        run: dbt compile --target ci

      # Optionally only run models modified in this PR + their children
      - name: dbt build (modified models)
        run: dbt build --target ci --select state:modified+

      # Or simply:
      # - name: dbt build
      #   run: dbt build --target ci

