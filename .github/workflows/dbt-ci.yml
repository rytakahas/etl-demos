name: dbt CI

on:
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  dbt-ci:
    runs-on: ubuntu-latest

    env:
      DBT_PROJECT_DIR: ${{ github.workspace }}/dbt
      DBT_PROFILES_DIR: ${{ github.workspace }}/dbt
      GOOGLE_APPLICATION_CREDENTIALS: ${{ github.workspace }}/gcp-dbt-sa.json

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dbt-bigquery
        run: |
          python -m pip install --upgrade pip
          pip install "dbt-bigquery==1.10.3"

      # Write SA key only if secret is available (fork PRs won't have it)
      - name: Write GCP service account key (if available)
        shell: bash
        run: |
          if [ -z "${{ secrets.GCP_SERVICE_ACCOUNT_KEY }}" ]; then
            echo "SKIP_BQ=true" >> $GITHUB_ENV
            echo "No GCP secret available in this run (likely fork PR). Will run compile-only."
            exit 0
          fi

          # Write secret exactly as-is (must be JSON contents)
          printf '%s' '${{ secrets.GCP_SERVICE_ACCOUNT_KEY }}' > "$GOOGLE_APPLICATION_CREDENTIALS"

          # Validate JSON without printing it
          python - <<'PY'
import json, os
p=os.environ["GOOGLE_APPLICATION_CREDENTIALS"]
with open(p,"r",encoding="utf-8") as f:
    json.load(f)
print("Service account JSON is valid.")
PY

      - name: Sanity check dbt project files
        run: |
          test -f "$DBT_PROJECT_DIR/dbt_project.yml"
          test -f "$DBT_PROFILES_DIR/profiles.yml"
          echo "dbt_project.yml and profiles.yml found."

      - name: dbt deps
        run: |
          dbt deps --project-dir "$DBT_PROJECT_DIR" --profiles-dir "$DBT_PROFILES_DIR"

      # If no secrets, compile only (still good CI signal)
      - name: dbt compile (no warehouse)
        if: env.SKIP_BQ == 'true'
        run: |
          dbt compile --project-dir "$DBT_PROJECT_DIR" --profiles-dir "$DBT_PROFILES_DIR" --target ci

      # If secrets exist, run full build + tests
      - name: dbt build (ci)
        if: env.SKIP_BQ != 'true'
        run: |
          dbt build --project-dir "$DBT_PROJECT_DIR" --profiles-dir "$DBT_PROFILES_DIR" --target ci

